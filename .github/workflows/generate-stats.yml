name: Generate Stats

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate stats page from S3
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      S3_BUCKET: archiver-demo-v1-public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats page
        run: python3 scripts/generate-stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stats.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: regenerate stats page"
            git push
          fi

      - name: Summary
        run: |
          python3 -c "
          import json, re
          html = open('docs/stats.html').read()
          m = re.search(r'const DATA = ({.*?});', html, re.DOTALL)
          d = json.loads(m.group(1))
          t = d['totals']
          print('### Stats Generated')
          print('')
          print('| Metric | Value |')
          print('|--------|-------|')
          print(f'| CVEs | {t[\"cves\"]:,} |')
          print(f'| Snapshots | {t[\"snapshots\"]:,} |')
          print(f'| Domains | {t[\"domains\"]:,} |')
          print(f'| Generated | {t[\"generated\"]} |')
          " >> "$GITHUB_STEP_SUMMARY"
